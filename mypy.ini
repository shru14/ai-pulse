# Type checks (mypy: pip install -r requirements-dev.txt; run with `python -m mypy`). The pre-commit hook in hooks/ runs it.
# They catch a wrong kind of value before it runs: a None where text is needed, a list passed where a dict is expected,
# a misspelt attribute. Adopted gradually (13 Nov 2026): every file is checked except the ones listed at the bottom,
# which had problems when checking began. A new file is checked from the start.

[mypy]
python_version = 3.11
files = aipulse
# Outside packages without type information (the offline translator, the summary and voice models) are taken on trust
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

# Not checked yet: 353 problems in these 58 files when checking began. Fix a file, take it off this list, and from
# then on the hook keeps it clean. Work down the list one file per change.
[mypy-aipulse.__main__,aipulse.access,aipulse.ai_money,aipulse.approve,aipulse.audio,aipulse.audit,aipulse.backfill,aipulse.bills.brazil,aipulse.bills.core,aipulse.bills.korea,aipulse.bills.taiwan,aipulse.brands,aipulse.brief,aipulse.buyouts,aipulse.chip_rules,aipulse.classify,aipulse.compute,aipulse.consultations,aipulse.court,aipulse.digest,aipulse.evaluate,aipulse.feeds,aipulse.fines,aipulse.glossary,aipulse.glossary_pages,aipulse.gov_ai,aipulse.harms,aipulse.incidents,aipulse.infra_watch,aipulse.insights,aipulse.jobs,aipulse.kind_pages,aipulse.lab_timelines,aipulse.memegen,aipulse.memes,aipulse.model_economy,aipulse.money,aipulse.monthly,aipulse.new_tests,aipulse.owners,aipulse.pacts,aipulse.pages,aipulse.poster,aipulse.preferences,aipulse.press,aipulse.promises,aipulse.publishers,aipulse.quality,aipulse.release_cards,aipulse.safety,aipulse.seo,aipulse.store,aipulse.subscribers,aipulse.topics,aipulse.translate,aipulse.weekly]
