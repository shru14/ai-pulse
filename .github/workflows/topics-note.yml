# The daily Follow the story job (a scheduled Claude routine) checks stories that carry a topic's tags but that its words
# miss, and drafts them on a topics/<day> branch; this emails the project inbox what that branch adds, to approve. Nothing
# goes on the site until the branch is merged into main (only with the owner's yes). Sent with the same Gmail account as
# the other daily notes.
name: Follow the story to approve

on:
  push:
    branches: ["topics/**"]

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Email the new entries to the project inbox
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: |
          git show origin/main:aipulse/topics.py > "$RUNNER_TEMP/base_topics.py"
          python -m aipulse topics-note --base "$RUNNER_TEMP/base_topics.py" --branch "$GITHUB_REF_NAME"
