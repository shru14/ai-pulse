# Every 6 hours: collect new stories from every source, then publish the static site to GitHub Pages.
# In between, every 30 minutes, a quick run reads only the labs' and companies' own blogs (where launches appear
# first: "Introducing Claude Sonnet 5.5") and republishes; it skips the re-sort, which the full run does.
# The database is carried from run to run in the Actions cache, and each full run also keeps a backup of it for 14
# days (an artifact named "database") and, once a week, a copy for 8 weeks (the "database-backups" release, with a
# SHA-256 checksum). A run that finds no cache (GitHub empties it after 7 days unused, or when the repo's caches pass
# 10 GB) starts from the newest backup, then the newest weekly copy, and only without either from data/seed.db.gz,
# which may be weeks older. The "v4" in the cache key marks the seed with history back to 2023 (python -m aipulse
# backfill); bump it whenever a new seed should replace the saved database.
# A push to main (a change to the code or the page) only rebuilds and publishes the site from the saved database, in
# a few minutes: no collecting, re-sorting, memes or dossiers (the next scheduled run does those, and "Run workflow"
# by hand does everything at once). Run workflow with run=build does the same as a push: the private Pulse Compass
# repo starts it on each push to its main (its publish-site.yml), so Compass changes go live in minutes.
# The heartbeat (heartbeat.yml) starts these runs on time, with run=full or run=quick; GitHub's own schedule below
# is best-effort (it left most runs unstarted or hours late) and stays only as a backup for the full runs.
name: Collect and publish

on:
  schedule:
    - cron: "0 */6 * * *"  # 00:00, 06:00, 12:00, 18:00 UTC: everything
  workflow_dispatch:
    inputs:
      run:
        description: "quick: only the labs' and companies' blogs; build: rebuild and publish only (no collecting); empty or full: everything"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write  # the data branch (below); the code itself is never changed
  actions: read  # the newest backup of the database, when the cache has none (below)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUICK: ${{ inputs.run == 'quick' }}
      BUILD: ${{ github.event_name == 'push' || inputs.run == 'build' }}  # rebuild and publish only, as a push does
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pulse Compass, the paid product, from its private repo, with a read-only key. It reaches the site only after
      # the build has encrypted it (aipulse/access.py). If this fails, the free site still publishes, without it.
      - name: Fetch Pulse Compass
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shru14/ai-pulse-compass
          ssh-key: ${{ secrets.COMPASS_DEPLOY_KEY }}
          persist-credentials: false
          path: compass

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore the database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: aipulse.db
          key: aipulse-db-v4-${{ github.run_id }}
          restore-keys: aipulse-db-v4-

      # Brand logo lookups (aipulse/brands.py), kept apart so the database's cache never changes shape.
      - name: Restore brand logos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/brands.json
            data/brands-wikidata.json
            data/brand-icons
          key: brands-${{ github.run_id }}
          restore-keys: brands-

      # English versions of non-English official records (aipulse/translate.py): an open-source model
      # (OPUS-MT, CC BY 4.0) run on the runner with two small libraries. No API; the model is cached.
      - name: Install the offline translator
        run: pip install --quiet -r requirements.txt  # pinned versions; what each package is for is noted there

      - name: Restore the translation model
        if: env.BUILD != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/translate-models
          key: translate-models-pt_en-1_9-zh_en-1_9-ja_en-1_1-vi_en-1_9-de_en-1_3-es-fr-ko-ru-ar-nb

      - name: Start from the newest backup, or the seed, if there is no saved database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f aipulse.db ] && exit 0
          ok() { python -c "import sqlite3, sys; sys.exit(sqlite3.connect('aipulse.db').execute('PRAGMA quick_check').fetchone()[0] != 'ok')"; }
          # 21 Nov 2026: a backup that exists but can't be used makes the seed a loud failure: the inbox is told
          # (below) and nothing from this run is saved over the cache or the backups, so the next run tries them again
          # (how many usable backups there are: an unreadable answer counts as some, to stay on the safe side)
          arts=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=database&per_page=20" --jq '[.artifacts[] | select(.expired | not)] | length' || echo 1)
          weeks=$(gh release view database-backups -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(test("^aipulse-[0-9]{4}-W[0-9]{2}[.]db[.]gz$"))] | length' 2>/dev/null || echo 0)
          had=$(( arts + weeks ))
          url=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=database&per_page=1"                 --jq '.artifacts[0] | select(.expired | not) | .archive_download_url' || true)
          if [ -n "$url" ] && gh api "$url" > "$RUNNER_TEMP/database.zip"              && unzip -p "$RUNNER_TEMP/database.zip" aipulse.db.gz | gunzip > aipulse.db && ok; then
            echo "::notice::The cache had no database: started from the newest backup"
          elif week=$(gh release view database-backups -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -E '^aipulse-[0-9]{4}-W[0-9]{2}\.db\.gz$' | sort | tail -n 1) && [ -n "$week" ] && gh release download database-backups -R "$GITHUB_REPOSITORY" -p "$week" -p "$week.sha256" -D "$RUNNER_TEMP" && (cd "$RUNNER_TEMP" && sha256sum -c "$week.sha256") && gunzip -c "$RUNNER_TEMP/$week" > aipulse.db && ok; then
            echo "::notice::The cache had no database and no 14-day backup: started from the weekly copy $week"
          else
            rm -f aipulse.db
            gunzip -c data/seed.db.gz > aipulse.db
            if [ "$had" -eq 0 ]; then
              echo "::warning::The cache had no database and there is no backup yet: started from the seed (data/seed.db.gz)"
            else
              echo "DB_LOST=The cache had no database and no backup could be restored, so this run started from the seed (data/seed.db.gz) and saved nothing." >> "$GITHUB_ENV"
              echo "::error::The cache had no database and no backup could be restored: started from the seed, and nothing will be saved"
            fi
          fi

      # 21 Nov 2026: the story count at the start, so the end of the run can refuse to save a database that lost many
      - name: Count the stories at the start
        run: echo "START_STORIES=$(python -c "import sqlite3; print(sqlite3.connect('aipulse.db').execute('SELECT count(*) FROM items').fetchone()[0])")" >> "$GITHUB_ENV"

      - name: Collect
        if: env.BUILD != 'true'
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub API: labs' new repositories (sources.py)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # free model list only; skipped while unset
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # free model list only; skipped while unset
        run: python -m aipulse --db aipulse.db collect ${{ inputs.run == 'quick' && '--labs' || '' }}

      # A source that has just started failing: one email to the project inbox (not shown on the site)
      - name: Tell the project inbox about sources that stopped working
        if: env.BUILD != 'true'
        continue-on-error: true
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: python -m aipulse --db aipulse.db source-alert

      # Stored stories keep the category they got when collected; this applies rule fixes to them too.
      - name: Re-sort stored stories with the current rules
        if: env.BUILD != 'true' && env.QUICK != 'true'
        run: python -m aipulse --db aipulse.db reclassify

      # A new stream's history back to 2023 (Infra & climate, added 3 Oct 2026): its sources'
      # archives, about 12 minutes a full run, carrying on where the last run stopped until every source is done.
      - name: History for a new stream
        if: env.BUILD != 'true' && env.QUICK != 'true'
        run: python -m aipulse --db aipulse.db history --stream infra --minutes 12

      # Gemini (free tier, the project's only AI model, for memes only) writes the last finished week's meme once a week; it is kept in the
      # database, so later runs reuse it. Without the secret, or on any error, the rule-based meme is used.
      - name: Meme of the week
        if: env.BUILD != 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m aipulse --db aipulse.db memes

      # Readers' weekly dossiers (aipulse/weekly.py): new stories become vectors with an open model (BGE-base-en-v1.5,
      # MIT) run on the runner with the translator's library; no API, nothing billed; the model is cached. Only the
      # last 45 days' stories (last week and the month before), at most 4,000 a run, newest first. Then each interest
      # readers follow is searched in last week's stories and kept in the database, for the site and the Monday email.
      - name: Restore the embedding model
        if: env.BUILD != 'true' && env.QUICK != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/embed-models
          key: embed-models-bge-base-en-v1.5-2de9369

      - name: Story vectors
        if: env.BUILD != 'true' && env.QUICK != 'true'
        continue-on-error: true
        run: python -m aipulse --db aipulse.db embed --limit 4000

      - name: Weekly dossiers
        if: env.BUILD != 'true' && env.QUICK != 'true'
        continue-on-error: true
        env:
          DIGEST_LIST_KEY: ${{ secrets.DIGEST_LIST_KEY }}  # reads the interests (never who follows them) from the sign-up web app
        run: python -m aipulse --db aipulse.db dossiers

      # The monthly issue's summary (aipulse/monthly.py): once a month is over, an open-source model (Qwen3-4B-Instruct,
      # Apache 2.0) run on the runner with llama.cpp writes it from the month's most reported headlines; no API, nothing
      # billed. Installed and downloaded (~2.5 GB) only when a summary is due; at most 4 months a run (2026's months
      # so far fill over the first runs, newest first), each kept in the database.
      - name: Monthly issue's summary
        if: env.BUILD != 'true' && env.QUICK != 'true'
        continue-on-error: true
        run: |
          if python -m aipulse --db aipulse.db monthly --due; then
            # the project's own prebuilt CPU wheels (PyPI has only the source, which would compile for minutes)
            pip install --quiet --only-binary=llama-cpp-python llama-cpp-python==0.3.36 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
            python -m aipulse --db aipulse.db monthly --limit 4
          fi

      # Today in AI's leaderboard: each story's rank at the day's first run and its best rank so far (aipulse/today.py),
      # kept in the database before it is saved, so the board's arrows and "was #N today" survive between runs
      - name: Today's leaderboard
        continue-on-error: true
        run: python -m aipulse --db aipulse.db board

      # The word of the last finished week (Monday to Saturday), kept once, so Sunday's email shows it and the next
      # weeks' words skip it (aipulse/digest.py, record_week_word)
      - name: Word of the week
        continue-on-error: true
        run: python -m aipulse --db aipulse.db week-word

      # SQLite's own check, fresh planner statistics, and a VACUUM when over a fifth of the file is empty (store.maintain).
      # Full runs only. A failed check stops a damaged file being saved over the good one in the cache.
      - name: Check and tidy the database
        id: tidy
        if: env.QUICK != 'true' && env.BUILD != 'true'
        continue-on-error: true
        run: python -m aipulse --db aipulse.db maintain

      - name: Fold the write-ahead log into the database file
        if: always()
        run: python -c "import sqlite3; c = sqlite3.connect('aipulse.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.execute('PRAGMA journal_mode=DELETE'); c.close()"

      # 21 Nov 2026 (backend plan, fix 1): runs drop a few stories (duplicates, a source taken off), never a tenth. A
      # bigger drop means something went wrong, so this run's database is not saved and the inbox is told (below).
      - name: Check no stories went missing
        id: kept
        if: always() && env.DB_LOST == ''
        continue-on-error: true  # the site is still built and published; only the save is refused
        run: |
          now=$(python -c "import sqlite3; print(sqlite3.connect('aipulse.db').execute('SELECT count(*) FROM items').fetchone()[0])")
          echo "Stories: $START_STORIES at the start, $now now"
          if [ -n "$START_STORIES" ] && [ "$now" -lt $(( START_STORIES * 9 / 10 )) ]; then
            echo "DB_LOST=The run ended with $now stories, down from $START_STORIES at the start, so its database was not saved; the cache and backups keep the last good one." >> "$GITHUB_ENV"
            echo "::error::Stories fell from $START_STORIES to $now: the database is not saved"; exit 1
          fi

      - name: Save the database
        if: always() && steps.tidy.outcome != 'failure' && steps.kept.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: aipulse.db
          key: aipulse-db-v4-${{ github.run_id }}

      # The backup the step above starts from when the cache is gone; also a way back from a bad run (Actions > a run >
      # Artifacts). Full runs only, and only a database that passes SQLite's own check. Public stories only, like the seed.
      - name: Check and pack the database for its backup
        id: pack
        if: env.QUICK != 'true' && env.BUILD != 'true' && steps.kept.outcome == 'success'
        continue-on-error: true
        run: |
          python -c "import sqlite3, sys; r = sqlite3.connect('aipulse.db').execute('PRAGMA quick_check').fetchone()[0]; print('SQLite check:', r); sys.exit(r != 'ok')"
          gzip -6 -c aipulse.db > "$RUNNER_TEMP/aipulse.db.gz"

      - name: Back up the database (kept 14 days)
        if: steps.pack.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database
          path: ${{ runner.temp }}/aipulse.db.gz
          retention-days: 14
          compression-level: 0  # already gzipped

      # 20 Nov 2026: a copy that outlives the cache and the 14-day backup. The first full run of each ISO week attaches
      # the packed database and its SHA-256 checksum to the "database-backups" release (a pre-release, never "latest");
      # the 8 newest weeks are kept. Public stories only, like the seed and the backup above.
      - name: Weekly copy of the database (kept 8 weeks)
        if: steps.pack.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=database-backups; name="aipulse-$(date -u +%G-W%V).db.gz"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "Database backups" --prerelease --latest=false --notes "Weekly copies of the public database, kept 8 weeks, each with a SHA-256 checksum. Restore: gunzip, then check with sha256sum -c."
          have=$(gh release view "$tag" --json assets --jq '.assets[].name')
          echo "$have" | grep -qx "$name" && exit 0
          cd "$RUNNER_TEMP" && cp aipulse.db.gz "$name" && sha256sum "$name" > "$name.sha256"
          gh release upload "$tag" "$name" "$name.sha256"
          { echo "$have"; echo "$name"; } | grep -E '^aipulse-[0-9]{4}-W[0-9]{2}\.db\.gz$' | sort -u | head -n -8 | while read -r old; do
            gh release delete-asset "$tag" "$old" -y; gh release delete-asset "$tag" "$old.sha256" -y || true
          done

      - name: Tell the project inbox the database was not saved
        if: always() && env.DB_LOST != '' && env.QUICK != 'true'
        continue-on-error: true
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: |
          python -m aipulse db-alert "$DB_LOST The run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Build the site
        env:
          COMPASS_USERS: ${{ secrets.COMPASS_USERS }}  # who can log in to Pulse Compass: `python -m aipulse compass-user`
        run: python -m aipulse --db aipulse.db build --out site

      # The daily listen (aipulse/audio.py): yesterday's two-minute clip for everyone and for each reader setup
      # (streams and choices; never who), read by Piper, an open-source voice (MIT) run on the runner: no API, nothing
      # billed. The voice (~110 MB, from Piper's own list, trained on public-domain recordings) is cached; the clips are
      # kept between runs (7 days), so a push or quick run publishes them as they are and a full run speaks only what
      # changed.
      - name: Restore the listen clips
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/listen
          key: listen-${{ github.run_id }}
          restore-keys: listen-

      - name: Restore the voice
        if: env.BUILD != 'true' && env.QUICK != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/voice
          key: piper-voice-${{ hashFiles('aipulse/audio.py') }}  # a new voice in audio.py downloads afresh

      - name: Daily listen
        if: env.BUILD != 'true' && env.QUICK != 'true'
        continue-on-error: true
        timeout-minutes: 15  # never holds up the site; a clip not made means that email has no bar
        env:
          DIGEST_LIST_KEY: ${{ secrets.DIGEST_LIST_KEY }}  # reads the readers' streams and choices (the log shows counts only)
        run: |
          pip install --quiet piper-tts==1.8.0 lameenc==1.9.0  # pinned, as in requirements.txt
          voice="$(python -c 'from aipulse import audio; print(audio.VOICE)')"
          url="$(python -c 'from aipulse import audio; print(audio.VOICE_URL)')"
          if [ ! -f "$voice" ]; then
            mkdir -p data/voice
            curl -sSfL -o "$voice" "$url.onnx" && curl -sSfL -o "$voice.json" "$url.onnx.json"
          fi
          python -m aipulse --db aipulse.db listen --dir site/listen

      - name: Save the listen clips
        if: always() && env.BUILD != 'true' && env.QUICK != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/listen
          key: listen-${{ github.run_id }}

      # Follow the story's spoken beats (topics.tell, topics.speak): the same offline voice tells each topic's story so
      # far, a clip per beat, kept between runs, so a full run speaks only new beats and a push or quick run copies the
      # kept ones (no voice installed). Clips a beat no longer uses leave the cache.
      - name: Restore the topic clips
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: topic-clips
          key: topic-clips-${{ github.run_id }}
          restore-keys: topic-clips-

      - name: Topic voices
        continue-on-error: true
        timeout-minutes: 30  # the first run speaks every topic once; a clip not made falls back to the browser's voice
        run: python -m aipulse --db aipulse.db topic-voice --site site --cache topic-clips

      - name: Save the topic clips
        if: always() && env.BUILD != 'true' && env.QUICK != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: topic-clips
          key: topic-clips-${{ github.run_id }}

      # The daily cloud jobs (the glossary's and Jobs blamed on AI's drafts) can reach GitHub but not the site: a copy of
      # data.json, gzipped, as the only file of the data branch, replaced each full run (one commit, no history kept).
      - name: Keep a copy of data.json on the data branch
        if: env.QUICK != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/data-branch"; mkdir -p "$d"; gzip -9 -c site/data.json > "$d/data.json.gz"; cd "$d"
          git init -q -b data && git add data.json.gz
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data.json from run $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # Shown on the run's page (github.com/<user>/<repo>/actions): progress you can check from a phone.
      - name: Report progress
        if: always()
        run: python -m aipulse --db aipulse.db status >> "$GITHUB_STEP_SUMMARY"

      - name: Save brand logos
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/brands.json
            data/brands-wikidata.json
            data/brand-icons
          key: brands-${{ github.run_id }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A backup for the daily email: GitHub has left the email workflow's own schedule unstarted (30 Sep 2026). Each
  # scheduled or heartbeat run of this workflow between 05:00 and 11:59 UTC starts the email workflow; it
  # sends the day once (a marker in the Actions cache), so every start after the first stops at once.
  morning-email:
    if: github.event_name == 'schedule' || (inputs.run != '' && inputs.run != 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the daily email if it's morning (UTC)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hour=$(date -u +%H)
          if [ "$hour" -ge 5 ] && [ "$hour" -lt 12 ]; then
            gh workflow run digest.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
          else
            echo "Not morning ($hour UTC): nothing to do."
          fi
