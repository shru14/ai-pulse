# Every 6 hours: collect new stories from every source, then publish the static site to GitHub Pages.
# In between, every 30 minutes, a quick run reads only the labs' and companies' own blogs (where launches appear
# first: "Introducing Claude Sonnet 5.5") and republishes; it skips the re-sort, which the full run does.
# The database is carried from run to run in the Actions cache; the first run (or one after the cache
# was evicted) starts from data/seed.db.gz. The "v2" in the cache key marks the seed with history back to
# 2023 (python -m aipulse backfill); bump it whenever a new seed should replace the saved database.
# A push to main (a change to the code or the page) only rebuilds and publishes the site from the saved database, in
# a few minutes: no collecting, re-sorting, memes or dossiers (the next scheduled run does those, and "Run workflow"
# by hand does everything at once).
# The heartbeat (heartbeat.yml) starts these runs on time, with run=full or run=quick; GitHub's own schedule below
# is best-effort (it left most runs unstarted or hours late) and stays only as a backup for the full runs.
name: Collect and publish

on:
  schedule:
    - cron: "0 */6 * * *"  # 00:00, 06:00, 12:00, 18:00 UTC: everything
  workflow_dispatch:
    inputs:
      run:
        description: "quick: only the labs' and companies' blogs; empty or full: everything"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUICK: ${{ inputs.run == 'quick' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the database
        uses: actions/cache/restore@v4
        with:
          path: aipulse.db
          key: aipulse-db-v4-${{ github.run_id }}
          restore-keys: aipulse-db-v4-

      # Brand logo lookups (aipulse/brands.py), kept apart so the database's cache never changes shape.
      - name: Restore brand logos
        uses: actions/cache/restore@v4
        with:
          path: |
            data/brands.json
            data/brands-wikidata.json
            data/brand-icons
          key: brands-${{ github.run_id }}
          restore-keys: brands-

      # English versions of non-English official records (aipulse/translate.py): an open-source model
      # (OPUS-MT, CC BY 4.0) run on the runner with two small libraries. No API; the model is cached.
      - name: Install the offline translator
        run: pip install --quiet ctranslate2 sentencepiece certifi pillow  # pillow: writes the meme's captions onto its template

      - name: Restore the translation model
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: data/translate-models
          key: translate-models-pt_en-1_9-zh_en-1_9-ja_en-1_1-vi_en-1_9-de_en-1_3-es-fr-ko-ru-ar-nb

      - name: Start from the seed if there is no saved database
        run: "[ -f aipulse.db ] || gunzip -c data/seed.db.gz > aipulse.db"

      - name: Collect
        if: github.event_name != 'push'
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub API: labs' new repositories (sources.py)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # free model list only; skipped while unset
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # free model list only; skipped while unset
        run: python -m aipulse --db aipulse.db collect ${{ inputs.run == 'quick' && '--labs' || '' }}

      # A source that has just started failing: one email to the project inbox (not shown on the site)
      - name: Tell the project inbox about sources that stopped working
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: python -m aipulse --db aipulse.db source-alert

      # Stored stories keep the category they got when collected; this applies rule fixes to them too.
      - name: Re-sort stored stories with the current rules
        if: github.event_name != 'push' && env.QUICK != 'true'
        run: python -m aipulse --db aipulse.db reclassify

      # A new stream's history back to 2023 (Infra & climate, added 3 Oct 2026): its sources'
      # archives, about 12 minutes a full run, carrying on where the last run stopped until every source is done.
      - name: History for a new stream
        if: github.event_name != 'push' && env.QUICK != 'true'
        run: python -m aipulse --db aipulse.db history --stream infra --minutes 12

      # Gemini (free tier, the project's only AI model, for memes only) writes the past 7 days' meme once a day; it is kept in the
      # database, so later runs reuse it. Without the secret, or on any error, the rule-based meme is used.
      - name: Meme of the week
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m aipulse --db aipulse.db memes

      # Readers' weekly dossiers (aipulse/weekly.py): new stories become vectors with an open model (BGE-base-en-v1.5,
      # MIT) run on the runner with the translator's library; no API, nothing billed; the model is cached. Only the
      # last 45 days' stories (last week and the month before), at most 4,000 a run, newest first. Then each interest
      # readers follow is searched in last week's stories and kept in the database, for the site and the Monday email.
      - name: Restore the embedding model
        if: github.event_name != 'push' && env.QUICK != 'true'
        uses: actions/cache@v4
        with:
          path: data/embed-models
          key: embed-models-bge-base-en-v1.5-2de9369

      - name: Story vectors
        if: github.event_name != 'push' && env.QUICK != 'true'
        continue-on-error: true
        run: python -m aipulse --db aipulse.db embed --limit 4000

      - name: Weekly dossiers
        if: github.event_name != 'push' && env.QUICK != 'true'
        continue-on-error: true
        env:
          DIGEST_LIST_KEY: ${{ secrets.DIGEST_LIST_KEY }}  # reads the interests (never who follows them) from the sign-up web app
        run: python -m aipulse --db aipulse.db dossiers

      # The monthly issue's summary (aipulse/monthly.py): once a month is over, an open-source model (Qwen3-4B-Instruct,
      # Apache 2.0) run on the runner with llama.cpp writes it from the month's most reported headlines; no API, nothing
      # billed. Installed and downloaded (~2.5 GB) only when a summary is due; at most 4 months a run (2026's months
      # so far fill over the first runs, newest first), each kept in the database.
      - name: Monthly issue's summary
        if: github.event_name != 'push' && env.QUICK != 'true'
        continue-on-error: true
        run: |
          if python -m aipulse --db aipulse.db monthly --due; then
            # the project's own prebuilt CPU wheels (PyPI has only the source, which would compile for minutes)
            pip install --quiet --only-binary=llama-cpp-python llama-cpp-python==0.3.36 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
            python -m aipulse --db aipulse.db monthly --limit 4
          fi

      # Today in AI's leaderboard: each story's rank at the day's first run and its best rank so far (aipulse/today.py),
      # kept in the database before it is saved, so the board's arrows and "was #N today" survive between runs
      - name: Today's leaderboard
        continue-on-error: true
        run: python -m aipulse --db aipulse.db board

      - name: Fold the write-ahead log into the database file
        if: always()
        run: python -c "import sqlite3; c = sqlite3.connect('aipulse.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.execute('PRAGMA journal_mode=DELETE'); c.close()"

      - name: Save the database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aipulse.db
          key: aipulse-db-v4-${{ github.run_id }}

      - name: Build the site
        run: python -m aipulse --db aipulse.db build --out site

      # Shown on the run's page (github.com/<user>/<repo>/actions): progress you can check from a phone.
      - name: Report progress
        if: always()
        run: python -m aipulse --db aipulse.db status >> "$GITHUB_STEP_SUMMARY"

      - name: Save brand logos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/brands.json
            data/brands-wikidata.json
            data/brand-icons
          key: brands-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # A backup for the daily email: GitHub has left the email workflow's own schedule unstarted (30 Sep 2026). Each
  # scheduled or heartbeat run of this workflow between 05:00 and 11:59 UTC starts the email workflow; it
  # sends the day once (a marker in the Actions cache), so every start after the first stops at once.
  morning-email:
    if: github.event_name == 'schedule' || inputs.run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the daily email if it's morning (UTC)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hour=$(date -u +%H)
          if [ "$hour" -ge 5 ] && [ "$hour" -lt 12 ]; then
            gh workflow run digest.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
          else
            echo "Not morning ($hour UTC): nothing to do."
          fi
