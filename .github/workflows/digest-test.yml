# Test only, on the "digest" branch: email yesterday's digest (all five streams) to the project's own inbox,
# from the live site's saved database. Nothing is published and the database isn't saved back.
# Delete this file before merging the branch.
name: Digest test

on:
  push:
    branches: [digest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the database (read only)
        uses: actions/cache/restore@v4
        with:
          path: aipulse.db
          key: aipulse-db-v4-${{ github.run_id }}
          restore-keys: aipulse-db-v4-

      - name: Diagnose (temporary)
        run: |
          python - <<'EOF'
          from datetime import date, timedelta
          from aipulse import store, rss
          conn = store.connect("aipulse.db")
          cards, _ = store.cards(conn, days=20, limit=10**6)
          for d in (date(2026, 9, 24) + timedelta(days=i) for i in range(4)):
              row = []
              for name, (cat, _, _) in rss.FEEDS.items():
                  got = rss.daily(cards, cat, today=d + timedelta(days=1), days=1).get(d, [])
                  late = [c for c in got if (c.get("added_at") or "") > f"{d + timedelta(days=1)}T06:00"]
                  row.append(f"{name} {len(got)} (found after next morning: {len(late)})")
              print(d, " | ".join(row))
          EOF

      - name: Send the test digest to the project inbox
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: |
          python -m aipulse --db aipulse.db digest --to "$DIGEST_EMAIL" --day 2026-09-27
          python -m aipulse --db aipulse.db digest --to "$DIGEST_EMAIL" --day 2026-09-25
