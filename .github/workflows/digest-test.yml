# Test only, on the "digest" branch: build test digests (all five streams) from the live site's saved database
# as HTML files to inspect. A push never emails; a run started by hand also sends one test digest to the project
# inbox. Nothing is published and the database isn't saved back.
# Delete this file before merging the branch.
name: Digest test

on:
  push:
    branches: [digest]
  workflow_dispatch:  # run by hand: also emails the Sept 25 test digest to the project inbox

permissions:
  contents: read

jobs:
  build-test-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the database (read only)
        uses: actions/cache/restore@v4
        with:
          path: aipulse.db
          key: aipulse-db-v4-${{ github.run_id }}
          restore-keys: aipulse-db-v4-

      - name: Re-sort and regroup with this branch's rules (the copy only; nothing is saved)
        run: |
          python -m aipulse --db aipulse.db reclassify
          python -m aipulse --db aipulse.db regroup
          python - <<'EOF'
          from aipulse import store, cluster
          conn = store.connect("aipulse.db")
          items = [it for it in store.query(conn, None, None, 14, limit=10**7) if not cluster._alone(it)]
          new = cluster.group(items)
          cluster.ANCHOR_IDF = 99
          old = {frozenset(it["id"] for it in g) for g in cluster.group(items)}
          for g in new:
              if len(g) > 1 and frozenset(it["id"] for it in g) not in old:
                  print("NEW GROUP:")
                  for it in g:
                      print(f"   {it['date']} {it['category']:6} {it['source'][:16]:16} {it['title'][:80]}")
          EOF

      # No email is sent: the digests are built as HTML files and kept as a run artifact to inspect.
      - name: Build the test digests (dry run, nothing sent)
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
        run: |
          mkdir -p out
          python -m aipulse --db aipulse.db digest --to nobody --day 2026-09-27 --dry-run out/digest-2026-09-27.html
          python -m aipulse --db aipulse.db digest --to nobody --day 2026-09-25 --dry-run out/digest-2026-09-25.html

      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: out/
          retention-days: 3

      # Only when started by hand (after the built digest was checked): one test email to the project inbox.
      - name: Email the checked test digest to the project inbox
        if: github.event_name == 'workflow_dispatch'
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: python -m aipulse --db aipulse.db digest --to "$DIGEST_EMAIL" --day 2026-09-25
