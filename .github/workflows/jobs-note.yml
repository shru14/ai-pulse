# The daily Jobs blamed on AI job (a scheduled Claude routine) drafts newly checked job cuts on a jobs/<day> branch;
# this emails the project inbox the cuts that branch adds, to approve. Nothing goes on the site until the branch is
# merged into main (only with the owner's yes). Sent with the same Gmail account as the glossary's note.
name: Job cuts to approve

on:
  push:
    branches: ["jobs/**"]

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Email the new cuts to the project inbox
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: |
          git show origin/main:aipulse/jobs.py > "$RUNNER_TEMP/base_jobs.py"
          python -m aipulse jobs-note --base "$RUNNER_TEMP/base_jobs.py" --branch "$GITHUB_REF_NAME"
