# The daily glossary job (a scheduled Claude routine) drafts new technical words on a glossary/<day> branch; this
# emails the project inbox the words that branch adds, with their meanings, to approve. Nothing goes on the site until
# the branch is merged into main (only with the owner's yes). Sent with the same Gmail account as the source alerts.
name: Glossary words to approve

on:
  push:
    branches: ["glossary/**"]

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Email the new words to the project inbox
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: |
          git show origin/main:aipulse/glossary.py > "$RUNNER_TEMP/base_glossary.py"
          python -m aipulse glossary-note --base "$RUNNER_TEMP/base_glossary.py" --branch "$GITHUB_REF_NAME"
