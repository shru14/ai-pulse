# The evening memes job (a local Claude routine) writes the next email's meme on a memes/<day> branch; this emails the
# project inbox its captions to approve. No email uses it until the branch is merged into main (only with the owner's
# yes). Sent with the same Gmail account as the other drafts' notes.
name: Meme to approve

on:
  push:
    branches: ["memes/**"]

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Email the meme to the project inbox
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: |
          git show origin/main:aipulse/memes_written.py > "$RUNNER_TEMP/base_memes_written.py" 2>/dev/null || echo "" > "$RUNNER_TEMP/base_memes_written.py"
          python -m aipulse memes-note --base "$RUNNER_TEMP/base_memes_written.py" --branch "$GITHUB_REF_NAME"
