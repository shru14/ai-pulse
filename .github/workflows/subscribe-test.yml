# Temporary, branch only (removed before merging): read the sign-up list and check yesterday's digest without
# sending or deleting anything.
name: Subscribe test

on:
  push:
    branches: [subscribe]

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the database (read only)
        uses: actions/cache/restore@v4
        with:
          path: aipulse.db
          key: aipulse-db-v4-${{ github.run_id }}
          restore-keys: aipulse-db-v4-
      - name: Check yesterday's digest for subscribers (dry run, nothing sent)
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_LIST_KEY: ${{ secrets.DIGEST_LIST_KEY }}
        run: |
          if [ -z "$DIGEST_LIST_KEY" ]; then echo "The sign-up web app isn't set up yet (no DIGEST_LIST_KEY)"; exit 0; fi
          python -m aipulse --db aipulse.db digest --subscribers --dry-run check.html
