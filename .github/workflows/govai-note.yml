# The daily What governments use AI for job (a scheduled Claude routine) drafts updated or new government lists on a
# govai/<day> branch; this emails the project inbox what that branch changes, to approve. Nothing goes on the site
# until the branch is merged into main (only with the owner's yes). Sent with the same Gmail account as the other notes.
name: Government AI lists to approve

on:
  push:
    branches: ["govai/**"]

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Email the changes to the project inbox
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: |
          git show origin/main:aipulse/gov_ai.py > "$RUNNER_TEMP/base_gov_ai.py"
          python -m aipulse govai-note --base "$RUNNER_TEMP/base_gov_ai.py" --branch "$GITHUB_REF_NAME"
