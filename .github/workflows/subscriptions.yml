# Every 30 minutes: read the project inbox for SUBSCRIBE / CHANGE / UNSUBSCRIBE emails (aipulse/subscribers.py),
# confirm new subscriptions and erase unsubscribed readers. The list lives only in the project's Gmail account;
# nothing is saved here, and the log shows counts, never addresses.
name: Subscriptions

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only read the inbox and print counts (nothing sent or deleted)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: subscriptions
  cancel-in-progress: false

jobs:
  subscriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Answer new subscriptions, erase unsubscribed readers
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: python -m aipulse subscribers ${{ inputs.dry_run && '--dry-run' || '' }}
