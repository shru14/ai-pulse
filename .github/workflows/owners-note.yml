# The daily AI money (Who owns a piece of whom) job (a scheduled Claude routine) drafts newly checked entries on an owners/<day> branch; this emails
# the project inbox what that branch adds, to approve. Nothing goes on the site until the branch is merged into main
# (only with the owner's yes). Sent with the same Gmail account as the glossary's and the job cuts' notes.
name: AI money deals to approve

on:
  push:
    branches: ["owners/**"]

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Email the new entries to the project inbox
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: |
          git show origin/main:aipulse/owners.py > "$RUNNER_TEMP/base_owners.py"
          git show origin/main:aipulse/ai_money.py > "$RUNNER_TEMP/base_money.py" 2>/dev/null || : > "$RUNNER_TEMP/base_money.py"
          python -m aipulse owners-note --base "$RUNNER_TEMP/base_owners.py" --base-money "$RUNNER_TEMP/base_money.py" \
            --branch "$GITHUB_REF_NAME"
