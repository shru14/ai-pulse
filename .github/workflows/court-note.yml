# The daily AI in court job (a scheduled Claude routine) drafts newly checked entries on a court/<day> branch; this emails
# the project inbox what that branch adds, to approve. Nothing goes on the site until the branch is merged into main
# (only with the owner's yes). Sent with the same Gmail account as the glossary's and the job cuts' notes.
name: AI in court steps to approve

on:
  push:
    branches: ["court/**"]

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Email the new entries to the project inbox
        env:
          DIGEST_EMAIL: ${{ secrets.DIGEST_EMAIL }}
          DIGEST_APP_PASSWORD: ${{ secrets.DIGEST_APP_PASSWORD }}
        run: |
          git show origin/main:aipulse/court.py > "$RUNNER_TEMP/base_court.py"
          python -m aipulse court-note --base "$RUNNER_TEMP/base_court.py" --branch "$GITHUB_REF_NAME"
